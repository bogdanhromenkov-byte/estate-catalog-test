{% extends "base.html" %}

{% block title %}Добавить объект - EstateHub{% endblock %}

{% block content %}
<div class="container">
    <div class="breadcrumb">
        <a href="/">← Back to catalog</a>
    </div>
    
    <div class="form-container">
        <h1>Add New Property</h1>
        
        <form method="POST" class="property-form">
            <div class="form-group">
                <label for="title">Property Title *</label>
                <input type="text" id="title" name="title" required placeholder="e.g. Modern Downtown Apartment">
            </div>
            
            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" rows="4" required placeholder="Detailed property description..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="price">Price ($) *</label>
                    <input type="number" id="price" name="price" required placeholder="250000">
                </div>
                
                <div class="form-group">
                    <label for="property_type">Property Type *</label>
                    <select id="property_type" name="property_type" required>
                        <option value="">Select type</option>
                        <option value="Apartment">Apartment</option>
                        <option value="House">House</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required placeholder="New York, 5th Avenue, 123">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="rooms">Number of Rooms</label>
                    <input type="number" id="rooms" name="rooms" placeholder="3">
                </div>
                
                <div class="form-group">
                    <label for="area">Area (sqm)</label>
                    <input type="number" step="0.1" id="area" name="area" placeholder="75.5">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="floor">Floor</label>
                    <input type="number" id="floor" name="floor" placeholder="5">
                </div>
                
                <div class="form-group">
                    <label for="total_floors">Total Floors</label>
                    <input type="number" id="total_floors" name="total_floors" placeholder="12">
                </div>
            </div>
            
            <div class="form-group">
                <label for="image_url">Image URL</label>
                <input type="url" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
                <small>Paste image link or leave empty</small>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn-primary btn-large">✅ Add Property</button>
                <a href="/" class="btn-secondary btn-large">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
